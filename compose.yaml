services:
  postgres:
    image: postgres:17
    container_name: kivo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kivo
      POSTGRES_USER: kivo
      POSTGRES_PASSWORD: kivo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: kivo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: